<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient - deep cinematic teal/purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient - red+gold BD colors -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd60a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text glow -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8d6e5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for text -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  
  <!-- Film strip left -->
  <rect x="30" y="120" width="18" height="160" rx="4" fill="#1e2d3d" stroke="#e63946" stroke-width="1.5"/>
  <rect x="33" y="130" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="33" y="155" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="33" y="180" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="33" y="205" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="33" y="230" width="12" height="16" rx="2" fill="#0d1b2a"/>
  
  <!-- Film strip right -->
  <rect x="352" y="120" width="18" height="160" rx="4" fill="#1e2d3d" stroke="#e63946" stroke-width="1.5"/>
  <rect x="355" y="130" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="355" y="155" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="355" y="180" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="355" y="205" width="12" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="355" y="230" width="12" height="16" rx="2" fill="#0d1b2a"/>
  
  <!-- Main C letter - bold cinematic -->
  <text x="200" y="210" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="160" 
        font-weight="bold" 
        fill="url(#textGrad)" 
        text-anchor="middle"
        filter="url(#textGlow)"
        letter-spacing="-4">C</text>
  
  <!-- Accent bar below C -->
  <rect x="90" y="228" width="220" height="6" rx="3" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- CynemaX Bd text -->
  <text x="200" y="270" 
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
        font-size="28" 
        font-weight="900"
        fill="url(#accentGrad)"
        text-anchor="middle"
        letter-spacing="4"
        filter="url(#glow)">CYNEMA X</text>
  
  <!-- BD badge -->
  <rect x="160" y="282" width="80" height="24" rx="12" fill="#e63946"/>
  <text x="200" y="299" 
        font-family="'Arial Black', Arial, sans-serif" 
        font-size="13" 
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="3">BD</text>
  
  <!-- Small developer credit -->
  <text x="200" y="340" 
        font-family="Arial, sans-serif" 
        font-size="11" 
        fill="#4a6fa5"
        text-anchor="middle"
        letter-spacing="1">by Shouko Nishimiya</text>
  
  <!-- Star accents -->
  <g transform="translate(95, 145)" filter="url(#glow)">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" fill="#ffd60a" opacity="0.8"/>
  </g>
  <g transform="translate(305, 145)" filter="url(#glow)">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" fill="#ffd60a" opacity="0.8"/>
  </g>
  <g transform="translate(200, 95)" filter="url(#glow)">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#ff6b35" opacity="0.6"/>
  </g>
</svg>
